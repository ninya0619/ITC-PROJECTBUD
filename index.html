<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectBud | Dashboard</title>

  <!--Icons-->
  <link rel="preconnect" href="fontawesome.com">

  <style>
    /* colors */
    :root {
      --darkgreen: #15370D;
      --lightgreen1:#4E8846;
      --lightgreen2: #6FB23E
      --white: #FFFFFF;
    }

    /* Sizes and Layout */
    :root {
      --sidebar-width: 250px;
      --topbar-height: 60px;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--lightgreen1);
      min-height: 100vh;
      border-top: 3px solid var(--white);
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 3px;
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      background: var(--darkgreen);
      color: var(--white);
      display: flex;
      flex-direction: column;
      padding: 0 6px 16px;
    }

    /* navbar */
    .nav {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 12px;
      color: var(--white);
      font-size: 16px;
      letter-spacing: 0.5px;
      border-radius: 6px;
    }

    .nav-item i {
      width: 24px;
      text-align: center;
      font-size: 20px;
    }

    .nav-item:hover {
      background: var(--lightgreen2);
    }

    /* logout button*/
    .logout-button{
      margin-top: auto;
      padding-left: 6px;
    }

    /* main area of sidebar */
    .main {
      margin-left: var(--sidebar-width);
    }

    /* topbar */
    .topbar {
      height: var(--topbar-height);
      background: var(--white);
      display: flex;
      justify-content: flex-end;
      padding: 0 12px;
    }

    /* profile */
    .profile {
      color: black;
      font-size: 30px;
    }

    /* content */
    .content {
      padding: 25px 15px;
    }

    /* welcome in dashboard */
    .welcome {
      background: var(--darkgreen);
      color: var(--white);
      border-radius: 12px;
      padding: 36px 24px 52px 24px;
    }

    .welcome h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      margin: 0 0 22px 24px;
    }

    .welcome p {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line height: 1.4;
      letter-spacing: 0.5px;
    }

    /* cards */
    .cards {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      padding-left: 4px;
    }

    .card {
      width: 332px;
      height: 250px;
      background: var(--darkgreen);
      border-radius: 12px;
    }

    @media (max-width: 700px) {
      .sidebar {width: 700px;}
      .sidebar .nav-item span {display: none;}
      .main {margin-left: 70px;}
      .welcome h1 {font-size: 32px; margin-left: 0;}
      .card {width: 100%;}
    }
  </style>
</head>
<body>
  
  
</body>
</html>
